<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="logo">
      <i class="fa-solid fa-droplet"></i>
    </div>

    @if (!collapsed) {
      <div class="brand">
        <h2>AquaSense</h2>
        <span>IoT · monitoreo</span>
      </div>
    }

    <button class="close-sidebar" type="button" (click)="close()" aria-label="Cerrar menú">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <nav class="menu" aria-label="Navegación principal">
    @for (item of menu; track item.id) {
      <div class="menu-item">
        <a [routerLink]="item.path" routerLinkActive="active" (click)="close()">
          <i [class]="item.icono || 'fa-solid fa-circle'"></i>
          @if (!collapsed) {
            <span>{{ item.nombre }}</span>
          }
        </a>
      </div>
    }
  </nav>

  <footer class="sidebar-footer">
    <a
      class="sidebar-footer__link"
      [routerLink]="profileLink.path"
      routerLinkActive="active"
      (click)="close()"
      [attr.title]="collapsed ? profileLink.nombre : null"
    >
      <i [class]="profileLink.icono || 'fa-solid fa-user-gear'"></i>
      @if (!collapsed) {
        <span>{{ profileLink.nombre }}</span>
      }
    </a>
  </footer>
</aside>
