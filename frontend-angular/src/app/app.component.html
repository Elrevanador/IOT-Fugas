<router-outlet />

<app-toast-container />
<app-confirm-dialog />

<div class="loading-overlay" [class.loading-overlay--visible]="loading.isBusy()" aria-live="polite" aria-busy="true">
  <div class="loading-overlay__panel">
    <div class="world-loader" aria-hidden="true">
      <svg class="world-loader__svg" viewBox="0 0 180 112" focusable="false">
        <defs>
          <radialGradient id="loader-ball-fill" cx="35%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="58%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </radialGradient>
        </defs>

        <path class="world-loader__field-line" d="M22 88 H158" />
        <path class="world-loader__field-arc" d="M72 88 C74 72 106 72 108 88" />
        <g class="world-loader__wake">
          <path d="M46 77 H74" />
          <path d="M34 84 H60" />
          <path d="M112 80 H138" />
        </g>
        <ellipse class="world-loader__shadow" cx="86" cy="87" rx="20" ry="5" />

        <g class="world-loader__ball">
          <circle class="world-loader__ball-shell" cx="0" cy="0" r="18" />
          <polygon class="world-loader__panel" points="0,-8 8,-3 5,7 -5,7 -8,-3" />
          <path class="world-loader__seams" d="M0 -8 L0 -18 M8 -3 L17 -7 M5 7 L11 16 M-5 7 L-11 16 M-8 -3 L-17 -7" />
          <path class="world-loader__seams" d="M-14 -11 C-8 -15 8 -15 14 -11 M-16 8 C-8 16 8 16 16 8" />
          <circle class="world-loader__shine" cx="-7" cy="-8" r="3.5" />
        </g>
      </svg>
    </div>
    <strong>Sincronizando</strong>
    <p>Preparando datos...</p>
  </div>
</div>
