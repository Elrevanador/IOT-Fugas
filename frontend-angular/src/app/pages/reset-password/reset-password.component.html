<section class="auth-page auth-page--centered">
  <article class="auth-card glass-panel">
    <header class="auth-header">
      <span class="eyebrow">Nueva clave</span>
      <h2>Crear contraseña</h2>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="password-field">
        <span>Nueva contraseña</span>

        <div class="password-field__control">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="password-field__toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        @if (passwordError(); as message) {
          <small class="field-error">{{ message }}</small>
        }
      </label>

      <label class="password-field">
        <span>Confirmar contraseña</span>

        <div class="password-field__control">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Repite la contraseña"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="password-field__toggle"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i [class]="showConfirmPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        @if (confirmPasswordError(); as message) {
          <small class="field-error">{{ message }}</small>
        }
      </label>

      <button type="submit" class="submit-button" [disabled]="isSubmitting() || !token()">
        @if (isSubmitting()) {
          <span class="button-loader"></span>
          <span>Guardando contraseña...</span>
        } @else {
          <span>Actualizar contraseña</span>
        }
      </button>
    </form>

    <p class="feedback" [attr.data-tone]="feedbackTone()">
      {{ feedback() }}
    </p>

    <footer>
      <a routerLink="/forgot-password">Solicitar otro enlace</a>
      <a routerLink="/login">Volver a iniciar sesión</a>
    </footer>
  </article>
</section>
