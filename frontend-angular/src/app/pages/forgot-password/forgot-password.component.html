<section class="auth-page auth-page--centered">
  <article class="auth-card glass-panel">
    <header class="auth-header">
      <span class="eyebrow">Recuperación</span>
      <h2>Recuperar contraseña</h2>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Correo registrado</span>
        <input
          type="email"
          formControlName="email"
          placeholder="tu-correo@ejemplo.com"
          autocomplete="email"
        />
        <small>Por seguridad, no mostraremos si el correo existe o no.</small>
      </label>

      <button type="submit" class="submit-button" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="button-loader"></span>
          <span>Enviando solicitud...</span>
        } @else {
          <span>Enviar enlace seguro</span>
        }
      </button>
    </form>

    <p class="feedback" [attr.data-tone]="feedbackTone()">
      {{ feedback() }}
    </p>

    @if (devResetUrl()) {
      <p class="feedback dev-reset-link" data-tone="info">
        Modo desarrollo: abre este enlace temporal para probar el cambio de contraseña:
        <a [href]="devResetUrl()">{{ devResetUrl() }}</a>
      </p>
    }

    <footer>
      <a routerLink="/login">Volver al inicio de sesión</a>
    </footer>
  </article>
</section>
